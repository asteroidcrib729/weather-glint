[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "weather-glint"
version = "0.1.0"
description = "Weather Glint: a weather application powered by FastAPI and MET Norway"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.10,<3",
  "tzdata>=2026.2; platform_system == 'Windows'",
  "uvicorn[standard]>=0.35,<1",
]

[tool.pyrefly.errors]
redundant-cast = "warn"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "mypy>=1.17,<3",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend"]

[tool.pyrefly]
project-includes = ["backend"]
python-version = "3.14.0"
preset = "legacy"
