version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: pre-production
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Major upgrades need a separate compatibility pass; security updates still target main.
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      react-runtime:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
      routine-frontend:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - react
          - react-dom
        update-types:
          - minor
          - patch
  - package-ecosystem: uv
    directory: /
    target-branch: pre-production
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      routine-python:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
